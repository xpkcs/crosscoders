[project]
name = "crosscoders"
version = "0.1.0"
description = ""
# authors = [
#     { name = "", email = "" }
# ]

requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"

dynamic = ["dependencies", "optional-dependencies"]


[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
# optional-dependencies = {file = []}

[project.scripts]
xc = "scripts.main:main"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
include = ["crosscoders"]